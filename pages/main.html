<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIP - Main</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/overlay-tool.css">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>

    <div class="screen_fader"></div>

    <script src="../utils/comp.js"></script>
    
    <script src="../utils/effects/fade.js"></script>
    <script>
        async function initComponents() {
            const componentsDict = await renderImageComponents('body', '../data/main_comps.json');
            const mainButton = componentsDict['main_button'];
            mainButton.addEventListener('click', () => {
                fade('.screen_fader', 'in', 1000, () => {
                    // quest1 페이지로 이동
                    window.location.href = '../pages/quest1.html';
                });
            },);

            if (localStorage.getItem('reset') == "true") {
                localStorage.setItem('reset', "false");
                location.reload();
            }

            // intro.m4a 오디오 무한 반복
            let introAudio = null;
            let audioStarted = false;
            
            function startAudio() {
                if (audioStarted) return;
                audioStarted = true;
                
                if (!introAudio) {
                    introAudio = new Audio('../static/audio/intro.m4a');
                    introAudio.loop = true;
                }
                
                introAudio.play().catch(error => {
                    console.log('오디오 재생 실패:', error);
                    audioStarted = false;
                });
            }
            
            // 사용자 상호작용 후에만 오디오 시작
            document.body.addEventListener('touchend', startAudio, { once: true });

        }
        
        initComponents();
    </script>
</body>
</html>
