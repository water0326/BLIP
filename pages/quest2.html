<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIP - Main</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/overlay-tool.css">
    <link rel="stylesheet" href="../css/quest2.css">
</head>
<body>

    <div class="screen_fader"></div>

    <div id="timer">+ 5분 0초</div>
    <div id="total_timer">+ 0분 0초</div>

    <script src="../utils/comp.js"></script>
    <script src="../utils/overlay-tool.js"></script>
    <script src="../utils/effects/fade.js"></script>
    <script>

        var canTouch = false;
        var isTouched = false;

        var timer_value = 0;
        localStorage.setItem('timer_value', 0);

        function start_timer() {
            const timer = document.getElementById('timer');
            const total_timer = document.getElementById('total_timer');
            setInterval(() => {
                timer_value++;
                timer.textContent = `+ ${Math.floor((timer_value + 300) / 60)}분 ${(timer_value + 300) % 60}초`;
                total_timer.textContent = `+ ${Math.floor(timer_value / 60)}분 ${timer_value % 60}초`;
            }, 1000);
        }

        function add_touch_event() {
            document.addEventListener('touchstart', () => {
                if (canTouch) {
                    isTouched = true;
                }
            });
        }

        const DEFAULT_FADE_DURATION = 300;
        const DEFAULT_FADE_DELAY = 300;

        async function initComponents() {
            const componentsDict = await renderImageComponents('body', '../data/quest2_comps.json');

            const animationSequence1 = [
                {action: 'out', selector: '.screen_fader', duration: DEFAULT_FADE_DURATION, delay: DEFAULT_FADE_DELAY}, // 화면 페이드아웃
            ];

            // Action
            add_touch_event();

            await runSequence(animationSequence1);
        }
        
        initComponents();
    </script>
</body>
</html>
